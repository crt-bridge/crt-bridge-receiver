[options]
Architecture = x86_64
ParallelDownloads = 5
# Arch's own default: every package signature is required. Repository
# databases are not signed by Arch (the archive serves no .sig for them).
SigLevel = Required DatabaseOptional

# Every package comes from one dated Arch Linux Archive snapshot. The date
# must match ALA_SNAPSHOT in build-env;
# build-image.sh refuses to build when they differ. No mirror list is
# included: mixing the archive with a live mirror is not safe.
[core]
Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/10/20/$repo/os/$arch
