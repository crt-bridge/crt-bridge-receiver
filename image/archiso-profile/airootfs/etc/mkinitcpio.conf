# crt-bridge receiver image -- mkinitcpio main config (NOT in conf.d/).
#
# Why in the main conf and not conf.d/archiso.conf: mkinitcpio as run by
# pacman's post-install hook during pacstrap was seen to ignore
# /etc/mkinitcpio.conf.d/*.conf overrides in this build environment. The
# resulting initramfs had no archiso hooks and no /init. Writing HOOKS here
# in the main config is what Arch's releng profile does, and it is known to
# produce a working netboot-capable initramfs.
#
# Radeon-specific notes:
# - radeon module is NOT listed in MODULES= because the kms hook handles it.
# - amdgpu is NOT listed (blacklisted via modprobe.d).
# - atl1, atl1c, atl1e and atl2 are the Atheros network drivers; the network
#   card of the reference machine uses atl1.
# - vfat and its two code pages let the archiso hook mount a FAT32 boot
#   stick: the filesystems hook adds vfat but leaves every code page out.

MODULES=(loop overlay squashfs atl1 atl1c atl1e atl2 vfat nls_cp437 nls_iso8859-1)

BINARIES=()

FILES=(/usr/lib/firmware/edid/jvc_dtv1710cg.bin)

# No memdisk hook: the image is never loaded by syslinux's memdisk, and the
# hook needs memdiskfind, which only the syslinux package carries. No
# archiso_shutdown either: mkinitcpio-archiso no longer ships it.
HOOKS=(base udev archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_http kms block filesystems keyboard keymap consolefont)

COMPRESSION="xz"
# NO COMPRESSION_OPTIONS -- those are for mksquashfs, not mkinitcpio's xz wrapper.
# `-Xbcj x86` here produces `xz: invalid option -- 'X'` and aborts initramfs
# generation with bsdtar write error.
KEYMAP=us
FONT=lat9w-16
