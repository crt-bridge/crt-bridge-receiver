# crt-bridge receiver -- force the radeon driver, not amdgpu.
# Under a 7.x kernel amdgpu claims Cape Verde cards (the HD 7750) first and
# breaks the picture: the forced EDID fails to load and the receiver's modes
# are refused. The receiver is built and tested on radeon only. The kernel
# command line also sets radeon.si_support=1 amdgpu.si_support=0.
blacklist amdgpu
install amdgpu /bin/true
