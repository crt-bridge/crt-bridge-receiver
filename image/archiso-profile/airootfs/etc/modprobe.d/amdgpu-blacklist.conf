# crt-bridge archrt-radeon-d0023r — force radeon driver, NOT amdgpu.
# Cape Verde HD 7750 is the upper edge of radeon-supported hardware;
# without this blacklist, amdgpu would claim the card first on modern
# kernels. D0023R's 15kHz patches target the radeon codepath only.
blacklist amdgpu
install amdgpu /bin/true
