# crt-bridge -- bake the JVC EDID into the initramfs.
# Required because the radeon driver loads at early KMS, before
# /usr/lib/firmware/ is mounted from the root filesystem. Without this
# line, drm.edid_firmware= on the kernel command line silently fails to find
# the file and falls back to the physical EDID (or none).

FILES=(/usr/lib/firmware/edid/jvc_dtv1710cg.bin)
