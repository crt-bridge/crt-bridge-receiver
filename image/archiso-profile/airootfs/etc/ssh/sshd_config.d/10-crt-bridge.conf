#
# sshd runs only in developer mode (crtbridge.dev=1 and an ed25519 key on the
# kernel command line). It lets root in by that key, never by a password.
# sshd keeps the first value it reads for a setting, and this file comes
# before the distribution's own drop-ins.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
