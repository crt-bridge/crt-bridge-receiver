# Waiting for the network, at most 15 seconds.
#
# The receiver daemon starts after network-online.target, so that the
# waiting screen can show the address the receiver got. The wait ends as soon
# as one interface has a routable IPv4 address, in practice a DHCP lease
# (--any --ipv4 --operational-state=routable), and gives up after 15 seconds:
# the daemon starts anyway, with or without an address.
#
# Why "routable": the link-local fallback of 20-wired.network starts at the
# same time as DHCP and usually claims its 169.254.x.x address within a
# second, before any DHCP server has answered. Without this option the wait
# would end on that address, and the daemon would start before the lease.
# Without a DHCP server, the wait runs to its limit and the link-local
# address is the one the receiver keeps.
#
# ConditionKernelCommandLine=!ip: on a network boot (ip= on the kernel
# command line) the address is set before the system starts, so there is
# nothing to wait for; skipping the wait keeps a network boot as fast as it
# was. A unit skipped by its condition counts as done for the units ordered
# after it.
[Unit]
ConditionKernelCommandLine=!ip

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --ipv4 --operational-state=routable --timeout=15
