# crt-bridge receiver settings
#
# To use a setting, remove the "#" at the start of its line, change the
# value, and save this file as plain text (Notepad does). Every line that
# starts with "#" is ignored. A setting is "name = value"; names ignore case.
# An unknown name or a wrong value is ignored, and report.txt, at the root of
# this stick, says so after the next boot.
#
# The values shown are the defaults.

# Sound card volume, 0 to 100.
# volume = 75

# Seconds without a picture before the waiting screen appears:
# 0 for never, otherwise 2 to 3600.
# idle_after = 10

# Waiting screen: text (it shows the receiver's address) or black.
# idle_screen = text

# Sound: on or off.
# audio = on

# Gamepad, keyboard and mouse sent back to the emitter: on or off.
# inputs = on

# More options for the receiver program, for advanced use: long options
# only (--name, or --name value), separated by spaces. An option the
# receiver does not know makes it stop; report.txt then says why.
# extra_options =
