# hardware/edid/jvc_dtv1710cg.ini -- pointer: this file no longer describes anything.
#
# The description of the JVC DT-V1710CG tube lives in hardware/monitors/jvc_dtv1710cg.ini
# (single source). That is the file switchres and the receiver's guard read.
#
# This file was used for the EDID generation of 2026-04-19, but switchres 2.2.2 never
# read it: it splits a `key value` line on the space, hence the value `= custom` for the
# monitor type (silent fallback to the `generic_15` preset), and its range line had only
# 11 fields instead of 16.
#
# So the EDID in service (jvc_dtv1710cg.bin) is the product of the `generic_15` fallback.
# The pinned switchres 2.2.2 tool established it: from the old file, it rebuilds this
# binary byte for byte (both checksums are recalled in GENERATION-LOG.md).
#
# Do not regenerate the EDID. See README.md.
